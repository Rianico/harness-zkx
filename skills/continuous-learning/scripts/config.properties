# ===========================================
# Continuous Learning System Configuration
# ===========================================

# How many observations before signaling the daemon to wake up
# Lower values = more responsive but higher CPU
# Higher values = less overhead but delayed processing
signal_every_n=20

# Minimum new observations needed before spawning agent
# Prevents pattern detection on tiny samples
# Higher values = better pattern quality, slower learning
min_observations_to_analyze=50

# Fallback interval (minutes) if no signal received
# Ensures processing even if signals are missed
run_interval_minutes=5

# Observation retention in days
# Older observations are archived/deleted
retention_days=30

# Max file size in MB before archiving observations
max_file_size_mb=10

# Model for observer agent
# haiku = fast and cheap, sonnet = higher quality
observer_model=haiku
