# Kind startup contract for herdr-bootstrap.
# See skills/herdr/scripts/herdr_bootstrap.py.
#
# trust_flags: native agent args appended after `--`
#   in `herdr agent start ... -- <flags>`.
#   The operator opts in per kind here; bootstrap never
#   invents flags. Verified against the real CLIs
#   (`<agent> --help`); unverified kinds MUST stay empty.
# invariant: how the ROLE INVARIANT reaches the agent.
#   inline — the agent binary accepts --append-system-prompt
#     (verified: pi, claude).
#   file — marker-wrapped append to AGENTS.md in the target
#     dir (cline prefers .clinerules).
# revision_moves: whether this kind's revision is a usable
#   acceptance signal. The prompt handshake confirms a
#   `--no-wait` delivery when the status turns `working` OR
#   the revision moves; a kind whose revision never moves has
#   only the status half, and a wanted state at revision 0 is
#   unsatisfiable (`herdr-wait` exits 2), so a revision-based
#   re-check must not be advised there. Optional; a kind
#   absent or leaving it out defaults to true (never blocked).
#   Verified false: agy (weak recognition, #238).
# lifecycle_bridge: the bridge script that carries this kind's
#   lifecycle signals, named when advice must point at the
#   status surface that is trustworthy where the raw state feed
#   is not. Optional; a kind that declares none is advised in
#   bridge-neutral terms, so no kind is told to look at another
#   kind's bridge.
#   Set: agy (herdr-agy-bridge).
# Kinds absent here fall back to `file`, no trust flags, and
# revision_moves true (forward-compatible, never blocked).
pi:
  trust_flags: ["--approve"]
  invariant: inline
claude:
  trust_flags: ["--dangerously-skip-permissions"]
  invariant: inline
cline:
  trust_flags: []
  invariant: file
codex:
  trust_flags: []
  invariant: file
copilot:
  trust_flags: []
  invariant: file
qodercli:
  trust_flags: []
  invariant: file
agy:
  trust_flags: []
  invariant: file
  revision_moves: false
  lifecycle_bridge: herdr-agy-bridge
