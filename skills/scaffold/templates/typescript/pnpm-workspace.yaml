# pnpm 12 blocks dependency build scripts by default. esbuild (a vite dep) needs
# its postinstall to install the matching native binary; allow exactly this one.
allowBuilds:
  esbuild: true

auditConfig:
  # GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 (via semantic-release > micromatch) has
  # no patched release at the time of writing, and every scaffolded repo
  # inherits it, so the audit gate would be red on day one. This suppresses
  # exactly that advisory; every other high-severity advisory still fails
  # `pnpm run audit`.
  # Removal condition: drop this entry once a patched braces ships or the
  # advisory clears.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
