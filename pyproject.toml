[project]
name = "claude-skills-harness"
version = "0.1.0"
description = "Agent skills harness with documentation scrapers"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "html2text",
    "markdown>=3.7",
    "pyyaml",
    "requests",
    "rich",
]

[dependency-groups]
dev = [
    "pydantic",
    "pytest>=9.0.2",
    "python-frontmatter>=1.3.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# skill-comply has its own pyproject.toml and needs to run from its directory
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B007", "B023", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"skills/*/scripts/**/*.py" = ["E402"]

[tool.basedpyright]
allowedUntypedLibraries = ["markdown", "bs4", "pytest", "yaml", "pydantic", "requests", "html2text", "tz", "rich", "frontmatter"]
reportMissingImports = false
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportOptionalMemberAccess = "warning"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportReturnType = "warning"
reportRedeclaration = "warning"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
