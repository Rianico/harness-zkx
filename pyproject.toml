[project]
name = "claude-skills-harness"
version = "0.1.0"
description = "Agent skills harness with documentation scrapers"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "html2text",
    "markdown>=3.7",
    "pyyaml",
    "requests",
    "rich",
]

[dependency-groups]
dev = [
    "basedpyright>=1.30",
    "pydantic",
    "pytest>=9.0.2",
    "python-frontmatter>=1.3.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# skill-comply has its own pyproject.toml and needs to run from its directory
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B007", "B023", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"skills/*/scripts/**/*.py" = ["E402"]
# Type-check configuration lives in pyrightconfig.json: basedpyright searches upward for a
# pyrightconfig.json and ignores this file, so a section here is silently dead when the repo
# sits inside a parent project that has one. Keep the gate's config where it is actually found.

[tool.uv]
# uv.lock records the index and the artifact URLs per package, so a machine-local mirror in the
# global uv config (Aliyun here) would make every CI runner fetch every wheel - and the managed
# CPython - from `mirrors.aliyun.com` over plain HTTP. Pin the canonical index for this repo.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

